chegada_inicial:
  fila: 1
  tempo: 2.0

aleatorios:
  seed: 12345
  quantidade: 100000

filas:
  1:                        # Caixa (fila central)
    servidores: 3           # MELHORIA: era 2
    capacidade: 10          # G/G/3/10
    atendimento: [4, 6]
    chegada: [2, 4]
    roteamento:
      - {probabilidade: 0.3, destino: 2}    # vai pro gerente
      - {probabilidade: 0.2, destino: 3}    # vai pra documentacao
      - {probabilidade: 0.5, destino: null} # sai do sistema

  2:                        # Gerente
    servidores: 2
    capacidade: 8           # G/G/2/8
    atendimento: [8, 12]
    roteamento:
      - {probabilidade: 0.2, destino: 1}    # volta pro caixa
      - {probabilidade: 0.8, destino: null} # sai do sistema

  3:                        # Documentacao
    servidores: 1
    capacidade: 5           # G/G/1/5
    atendimento: [5, 9]
    roteamento:
      - {probabilidade: 0.4, destino: 1}    # MELHORIA: era 0.6
      - {probabilidade: 0.6, destino: null} # MELHORIA: era 0.4